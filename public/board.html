<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공유 갤러리 - 안단테 (Andante)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=38">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="modal.js?v=2"></script>
    <style>
        body {
            background-color: var(--bg, #FDFBD4);
            color: var(--ink, #111111);
            min-height: 100vh;
        }
    </style>
</head>
<body class="antialiased min-h-screen">
    <!-- Global Navigation Header (메인 페이지와 동일한 구조) -->
    <header class="app-header max-w-6xl mx-auto relative flex items-center justify-between px-6 sm:px-8 py-5 my-4 relative-z">
        <!-- Left Nav Links -->
        <div class="flex items-center gap-4 sm:gap-6 z-10">
            <button onclick="location.href='/'" class="text-xs text-[#111111] hover:opacity-70 transition-opacity font-medium whitespace-nowrap cursor-pointer">
                홈으로
            </button>
            <button onclick="location.href='/?view=diary'" class="text-xs text-[#111111] hover:opacity-70 transition-opacity font-medium whitespace-nowrap cursor-pointer">
                내 일기장
            </button>
        </div>

        <!-- Center Brand Logo -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-center cursor-pointer group pointer-events-auto" onclick="location.href='/'">
            <h1 class="font-editorial-title text-2xl md:text-3xl font-light text-[#111111] tracking-[0.28em] transition-transform duration-300 group-hover:scale-[1.02]">
                ANDANTE
            </h1>
            <p class="font-editorial-sub text-[11px] text-[#111111] mt-0.5 font-medium whitespace-nowrap">
                마음의 안식을 담는 공간
            </p>
        </div>

        <!-- Right Nav Links & User Status -->
        <div class="flex items-center gap-3 sm:gap-4 z-10">
            <span id="user-info" class="text-xs text-[#111111] font-medium hidden sm:inline-block whitespace-nowrap"></span>
            <button id="mypage-btn" onclick="location.href='/mypage.html'" class="text-xs text-[#111111] hover:opacity-70 transition-opacity font-medium whitespace-nowrap cursor-pointer">
                마이페이지
            </button>
            <button id="logout-btn" class="text-xs text-[#111111] hover:text-rose-600 transition-colors font-medium whitespace-nowrap cursor-pointer">
                로그아웃
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-6 py-4 relative-z pb-16">
        <!-- Title section (영문 대문자 제거) -->
        <div class="text-center mb-10 space-y-1.5">
            <h1 class="font-editorial-title text-2xl md:text-3xl font-light text-[#111111] tracking-tight">
                공유 갤러리
            </h1>
            <p class="text-[#111111] text-sm opacity-75 font-light">마음의 안식을 찾은 순간들을 함께 감상해보세요.</p>
        </div>
        
        <!-- Board Container (데스크톱 4열 그리드, 같은 행 높이 일치) -->
        <div id="board-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 items-stretch">
            <!-- Cards go here -->
        </div>
        
        <!-- Pagination -->
        <div id="pagination-controls" class="flex justify-center gap-2 mt-12 flex-wrap"></div>
    </div>
    
    <div id="toast" class="hidden"></div>

    <script>
        const token = sessionStorage.getItem('authToken');
        if (!token) window.location.href = '/login.html';
        
        const userInfoEl = document.getElementById('user-info');
        const authName = sessionStorage.getItem('authName') || sessionStorage.getItem('authUsername');
        if (authName) {
            userInfoEl.textContent = `${authName}님`;
            userInfoEl.classList.remove('hidden');
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            ['authToken', 'authUsername', 'authName', 'authGender', 'authAge', 'authMbti'].forEach(k => sessionStorage.removeItem(k));
            window.location.href = '/login.html';
        });

        const showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-stone-900 text-white px-6 py-3 rounded-full text-xs font-medium shadow-xl z-50 transition-all';
            setTimeout(() => toast.className = 'hidden', 3000);
        };

        const loadBoards = async (page = 1) => {
            const container = document.getElementById('board-container');
            const pageControls = document.getElementById('pagination-controls');
            container.innerHTML = '<div class="col-span-full py-16 text-center"><div class="spinner mx-auto mb-4 border-stone-300 border-t-stone-800"></div><p class="font-editorial-serif text-xs text-[#111111] opacity-60">작품을 불러오는 중...</p></div>';
            pageControls.innerHTML = '';

            try {
                const res = await fetch(`/api/boards?page=${page}&limit=8`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '목록 조회 실패');

                container.innerHTML = '';
                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<div class="col-span-full rounded-2xl p-12 text-center border border-black/10 bg-white/70 shadow-sm"><p class="font-editorial-serif text-[#111111] text-sm opacity-60">아직 공유된 작품이 없습니다.</p></div>';
                    return;
                }

                data.items.forEach(post => {
                    const card = document.createElement('div');
                    // [Requirement 2] 게시글 저장된 theme_color 또는 기본 메인 배경 사용
                    const cardBg = post.THEME_COLOR || 'var(--bg, #FDFBD4)';
                    card.className = 'group rounded-2xl p-4 border border-black/10 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between cursor-pointer h-full';
                    card.style.backgroundColor = cardBg;
                    card.onclick = () => { window.location.href = `/post.html?id=${post.ID}`; };

                    const date = new Date(post.CREATED_AT).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
                    const isLiked = (post.IS_LIKED > 0);

                    // Tag chips (Weather & Mood)
                    const tagChips = [];
                    if (post.WEATHER) tagChips.push(`🌤️ ${post.WEATHER}`);
                    if (post.MOOD) tagChips.push(`${post.MOOD}`);
                    const tagChipsHtml = tagChips.map(t => 
                        `<span class="bg-white/70 border border-white/80 text-[#111111] px-2.5 py-0.5 rounded-full text-[11px] font-sans font-medium whitespace-nowrap">${t}</span>`
                    ).join('');

                    card.innerHTML = `
                        <!-- 그림 썸네일 (4:3) -->
                        <div class="overflow-hidden rounded-xl aspect-[4/3] bg-stone-100/50 relative mb-3.5 border border-black/5 shadow-[inset_0_0_0_1px_rgba(0,0,0,0.03)] flex-shrink-0">
                            <img src="${post.IMAGE_BASE64}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${post.TITLE || '작품'}" />
                        </div>
                        
                        <!-- 카드 본문 메타 -->
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-[#111111] font-editorial-serif font-medium text-base line-clamp-1 mb-2 tracking-tight">
                                    ${post.TITLE || '무제'}
                                </h3>
                                
                                <div class="flex items-center justify-between text-xs mb-2.5">
                                    <span class="bg-white/70 border border-white/80 text-[#111111] px-2.5 py-0.5 rounded-full font-sans font-medium">
                                        ${post.USERNAME || '익명'}
                                    </span>
                                    <span class="text-[#111111] text-xs font-light opacity-70">
                                        ${date}
                                    </span>
                                </div>

                                ${tagChipsHtml ? `<div class="flex flex-wrap gap-1.5 mb-2">${tagChipsHtml}</div>` : ''}
                            </div>
                            
                            <!-- 카드 하단 구분선 & 액션 바 (음악 정보/버튼 제외) -->
                            <div>
                                <div class="border-t border-white/80 my-3"></div>
                                <div class="flex items-center justify-between text-xs text-[#111111]">
                                    <button class="like-btn flex items-center gap-1.5 hover:text-rose-600 transition-colors cursor-pointer" title="공감">
                                        <span class="text-sm like-icon ${isLiked ? 'text-rose-600' : ''}">${isLiked ? '♥' : '♡'}</span>
                                        <span class="like-count font-medium">${post.LIKE_COUNT || 0}</span>
                                    </button>
                                    <span class="text-[#111111] font-medium flex items-center gap-1 group-hover:translate-x-0.5 transition-transform">
                                        감상하기 <span>→</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;

                    // Like toggle handler with stopPropagation
                    const likeBtn = card.querySelector('.like-btn');
                    if (likeBtn) {
                        likeBtn.onclick = async (e) => {
                            e.stopPropagation();
                            try {
                                const lRes = await fetch('/api/likes', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                    body: JSON.stringify({ board_id: post.ID })
                                });
                                const lData = await lRes.json();
                                if (lData.isLiked !== undefined) {
                                    const iconEl = likeBtn.querySelector('.like-icon');
                                    const countEl = likeBtn.querySelector('.like-count');
                                    if (countEl) countEl.textContent = lData.count;
                                    if (iconEl) {
                                        iconEl.textContent = lData.isLiked ? '♥' : '♡';
                                        if (lData.isLiked) iconEl.classList.add('text-rose-600');
                                        else iconEl.classList.remove('text-rose-600');
                                    }
                                }
                            } catch(err) {
                                showToast('좋아요 처리 중 오류가 발생했습니다.');
                            }
                        };
                    }

                    container.appendChild(card);
                });

                if (data.totalPages > 1) {
                    for (let i = 1; i <= data.totalPages; i++) {
                        const btn = document.createElement('button');
                        btn.className = `px-4 py-2 rounded-full text-xs font-serif transition-all cursor-pointer ${i === data.currentPage ? 'bg-stone-900 text-white font-medium shadow-sm' : 'bg-white/80 border border-black/10 text-[#111111] hover:bg-white shadow-sm'}`;
                        btn.textContent = i;
                        btn.onclick = () => loadBoards(i);
                        pageControls.appendChild(btn);
                    }
                }
            } catch (e) {
                container.innerHTML = `<div class="col-span-full bg-white/70 border border-black/10 rounded-2xl p-8 text-center font-editorial-serif text-[#111111] text-sm">${e.message}</div>`;
            }
        };

        loadBoards(1);
    </script>
</body>
</html>
