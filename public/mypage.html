<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안단테 (Andante) - 마이 페이지</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="modal.js"></script>
</head>
<body class="bg-gray-50 text-slate-800">
    <header class="app-header max-w-4xl mx-auto flex items-center justify-between p-4 my-6 rounded-3xl border-2 border-black bg-card shadow-brutal relative-z">
        <div class="header-brand flex items-center gap-3" style="cursor: pointer;" onclick="location.href='/'">
            <h1 class="logo-text text-xl font-black text-black leading-tight margin-0">
                Andante
            </h1>
        </div>
        <div class="header-nav flex items-center gap-2">
            <button onclick="location.href='/'" class="icon-btn brutal-btn bg-white text-black font-bold">홈으로</button>
            <button onclick="location.href='/board.html'" class="icon-btn brutal-btn bg-mint text-black font-bold">공유 게시판</button>
            <button id="logout-btn" class="icon-btn brutal-btn bg-red text-black font-bold">로그아웃</button>
        </div>
    </header>

    <div class="container" style="max-width: 600px; margin: 4rem auto; padding: 0 20px;">
        <div class="brutal-card bg-white p-8">
            <h2 class="text-2xl font-black mb-6 text-center">내 정보 수정</h2>
            
            <div class="input-group mb-4">
                <label class="block text-sm font-bold mb-2">아이디</label>
                <input type="text" id="profile-username" disabled class="brutal-input bg-gray-200 text-gray-500 w-full" style="cursor: not-allowed;">
                <p class="text-xs text-gray-500 mt-1">아이디는 변경할 수 없습니다.</p>
            </div>
            
            <div class="input-group mb-4">
                <label for="profile-name" class="block text-sm font-bold mb-2">이름</label>
                <input type="text" id="profile-name" placeholder="이름을 입력하세요" class="brutal-input w-full">
            </div>

            <div class="input-group mb-4">
                <label for="profile-age" class="block text-sm font-bold mb-2">나이</label>
                <input type="number" id="profile-age" placeholder="나이를 입력하세요" min="1" max="120" class="brutal-input w-full">
            </div>

            <div class="input-group mb-4">
                <label for="profile-mbti" class="block text-sm font-bold mb-2">MBTI</label>
                <select id="profile-mbti" class="brutal-input w-full appearance-none bg-white">
                    <option value="INTJ">INTJ (용의주도한 전략가)</option>
                    <option value="INTP">INTP (논리적인 사색가)</option>
                    <option value="ENTJ">ENTJ (대담한 통솔자)</option>
                    <option value="ENTP">ENTP (뜨거운 논쟁을 즐기는 변론가)</option>
                    <option value="INFJ">INFJ (선의의 옹호자)</option>
                    <option value="INFP">INFP (열정적인 중재자)</option>
                    <option value="ENFJ">ENFJ (정의로운 사회운동가)</option>
                    <option value="ENFP">ENFP (재기발랄한 활동가)</option>
                    <option value="ISTJ">ISTJ (청렴결백한 논리주의자)</option>
                    <option value="ISFJ">ISFJ (용감한 수호자)</option>
                    <option value="ESTJ">ESTJ (엄격한 관리자)</option>
                    <option value="ESFJ">ESFJ (사교적인 외교관)</option>
                    <option value="ISTP">ISTP (만능 재주꾼)</option>
                    <option value="ISFP">ISFP (호기심 많은 예술가)</option>
                    <option value="ESTP">ESTP (모험을 즐기는 사업가)</option>
                    <option value="ESFP">ESFP (자유로운 영혼의 연예인)</option>
                </select>
            </div>

            <div class="input-group mb-6">
                <label class="block text-sm font-bold mb-2">성별</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="radio" name="profile-gender" value="남성" class="w-4 h-4 accent-black"> 남성</label>
                    <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="radio" name="profile-gender" value="여성" class="w-4 h-4 accent-black"> 여성</label>
                    <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="radio" name="profile-gender" value="기타" class="w-4 h-4 accent-black"> 기타</label>
                </div>
            </div>

            <div class="input-group mb-8">
                <label for="profile-password" class="block text-sm font-bold mb-2">새 비밀번호 (선택)</label>
                <input type="password" id="profile-password" placeholder="변경할 경우에만 입력하세요" class="brutal-input w-full">
                <p class="text-xs text-gray-500 mt-1">비밀번호를 변경하고 싶지 않다면 비워두세요.</p>
            </div>

            <div class="flex justify-between gap-4">
                <button id="cancel-btn" class="brutal-btn bg-white w-full" onclick="location.href='/'">취소</button>
                <button id="save-profile-btn" class="brutal-btn bg-yellow w-full">정보 수정 저장</button>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const toast = document.getElementById('toast');
            const showToast = (msg) => {
                toast.textContent = msg;
                toast.className = 'fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-black text-white px-6 py-3 rounded-full font-bold shadow-brutal-sm z-50';
                setTimeout(() => toast.className = 'hidden', 3000);
            };

            const authToken = sessionStorage.getItem('authToken');
            if (!authToken) {
                window.location.href = '/login.html';
                return;
            }

            document.getElementById('logout-btn').addEventListener('click', () => {
                ['authToken', 'authUsername', 'authName', 'authGender', 'authAge', 'authMbti'].forEach(k => sessionStorage.removeItem(k));
                window.location.href = '/';
            });

            // 내 정보 불러오기
            try {
                const res = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!res.ok) {
                    if(res.status === 401) {
                        ['authToken', 'authUsername', 'authName', 'authGender', 'authAge', 'authMbti'].forEach(k => sessionStorage.removeItem(k));
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('정보를 불러오는데 실패했습니다.');
                }
                const user = await res.json();
                
                document.getElementById('profile-username').value = user.username;
                document.getElementById('profile-name').value = user.name;
                document.getElementById('profile-age').value = user.age || '';
                
                if (user.mbti) {
                    const mbtiSelect = document.getElementById('profile-mbti');
                    const match = Array.from(mbtiSelect.options).find(opt => opt.value === user.mbti.toUpperCase());
                    if (match) mbtiSelect.value = match.value;
                }
                
                if (user.gender) {
                    const genderRadio = document.querySelector(`input[name="profile-gender"][value="${user.gender}"]`);
                    if (genderRadio) genderRadio.checked = true;
                }
            } catch (err) {
                showToast(err.message);
            }

            // 정보 수정 저장
            document.getElementById('save-profile-btn').addEventListener('click', async () => {
                const name = document.getElementById('profile-name').value.trim();
                const age = document.getElementById('profile-age').value.trim();
                const mbti = document.getElementById('profile-mbti').value;
                const password = document.getElementById('profile-password').value.trim();
                const genderEl = document.querySelector('input[name="profile-gender"]:checked');
                
                if (!name || !age || !genderEl) {
                    return showToast('이름, 나이, 성별을 모두 입력해주세요.');
                }
                const gender = genderEl.value;

                try {
                    const res = await fetch('/api/auth/me', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({ name, gender, age, mbti, password })
                    });
                    const data = await res.json();
                    
                    if (!res.ok) throw new Error(data.error);
                    
                    showToast('정보가 성공적으로 수정되었습니다.');
                    
                    sessionStorage.setItem('authName', name);
                    sessionStorage.setItem('authGender', gender);
                    sessionStorage.setItem('authAge', age);
                    sessionStorage.setItem('authMbti', mbti);
                    
                    if (password) {
                        showToast('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
                        setTimeout(() => {
                            ['authToken', 'authUsername', 'authName', 'authGender', 'authAge', 'authMbti'].forEach(k => sessionStorage.removeItem(k));
                            window.location.href = '/login.html';
                        }, 2000);
                    }
                } catch (err) {
                    showToast(err.message);
                }
            });
        });
    </script>
</body>
</html>
