<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 감상 - Andante</title>
    <link rel="stylesheet" href="style.css?v=8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="modal.js"></script>
</head>
<body class="bg-[#FAF8F5] text-stone-800 antialiased min-h-screen">
    <!-- Ambient Dreamy Blobs Background -->
    <div id="blob-bg" class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Editorial Header -->
    <header class="app-header max-w-5xl mx-auto flex items-center justify-between px-8 py-5 my-6 relative-z">
        <div class="text-left cursor-pointer group" onclick="location.href='/'">
            <h1 class="font-editorial-title text-2xl md:text-3xl font-light text-stone-900 tracking-[0.28em] transition-transform duration-300 group-hover:scale-[1.02]">
                ANDANTE
            </h1>
            <p class="font-editorial-sub text-[11px] text-stone-600 tracking-widest mt-0.5 font-medium">
                a piece of comfort
            </p>
        </div>

        <div class="flex items-center gap-6">
            <button onclick="location.href='/board.html'" class="text-xs uppercase tracking-widest text-stone-700 hover:text-stone-950 transition-colors font-medium flex items-center gap-1.5 font-serif">
                <span>←</span> <span>갤러리로 돌아가기</span>
            </button>
            <button id="mypage-btn" onclick="location.href='/mypage.html'" class="text-xs uppercase tracking-widest text-stone-700 hover:text-stone-950 transition-colors font-medium font-serif">
                마이페이지
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-4 relative-z">
        <!-- 1. Main Article Card (Editorial Art Poem Book Style) -->
        <article class="max-w-2xl mx-auto bg-white rounded-3xl p-6 md:p-10 border border-stone-200/90 shadow-xl shadow-stone-900/5 mb-8">
            <!-- Header Area -->
            <div class="flex items-start justify-between mb-4">
                <div class="flex-1 pr-4">
                    <h1 id="post-title" class="text-2xl md:text-3xl font-serif font-medium text-stone-900 tracking-tight mb-2.5 break-keep">
                        작품을 불러오는 중...
                    </h1>
                    <div class="flex items-center gap-2 text-xs text-stone-500">
                        <span id="post-author" class="bg-stone-100 border border-stone-200 text-stone-700 px-2.5 py-0.5 rounded-full font-sans font-medium">
                            작가
                        </span>
                        <span id="post-date" class="font-light"></span>
                    </div>
                </div>

                <!-- Action Links (Edit / Delete) -->
                <div id="action-btns" class="hidden flex items-center gap-2 text-xs text-stone-400 pt-1">
                    <button id="edit-btn" class="hover:text-stone-700 transition-colors font-serif">수정</button>
                    <span>·</span>
                    <button id="delete-btn" class="hover:text-rose-500 transition-colors font-serif">삭제</button>
                </div>
            </div>

            <div class="border-t border-stone-100 my-6"></div>

            <!-- Artwork Image Frame (Aspect 4:3 Frame) -->
            <div class="rounded-2xl overflow-hidden aspect-[4/3] bg-stone-100 border border-stone-200/80 shadow-sm mb-6 flex justify-center items-center">
                <img id="post-image" src="" alt="Artwork" class="w-full h-full object-cover" style="display: none;">
            </div>

            <!-- Meta Tags Chips (Pebble Chips) -->
            <div id="post-tags" class="flex flex-wrap gap-2 mb-8">
                <!-- Tags inserted dynamically -->
            </div>

            <!-- Poem Body (Serif Typography + Breathing Divider) -->
            <div id="post-content" class="font-serif font-editorial-serif text-stone-800 text-base md:text-lg leading-[2.3] space-y-6 text-center break-keep my-10 px-4">
                <!-- Poem paragraphs inserted dynamically -->
            </div>

            <!-- Empathy (Like) Button -->
            <div class="flex justify-center pt-8 border-t border-stone-100">
                <button id="like-btn" class="flex items-center gap-2 px-6 py-3 rounded-full border border-stone-200 bg-white hover:border-rose-200 hover:text-rose-500 text-stone-600 text-sm transition-all shadow-sm group cursor-pointer">
                    <span id="like-icon" class="text-base transition-transform group-hover:scale-110">♡</span>
                    <span class="font-serif">공감</span>
                    <span id="like-count" class="font-medium">0</span>
                </button>
            </div>
        </article>

        <!-- 2. Comments Section (Guestbook & Warm Letter Style) -->
        <section class="max-w-2xl mx-auto bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-8 border border-stone-200/90 shadow-sm mb-20">
            <h2 class="font-serif text-lg text-stone-900 font-medium mb-4 flex items-center justify-between">
                <span>마음 나누기 <span class="text-sm font-normal text-stone-500">(댓글)</span></span>
                <span id="comments-count" class="text-xs font-light text-stone-400"></span>
            </h2>

            <!-- Comment Input -->
            <div class="flex gap-2.5 mb-6">
                <input type="text" id="comment-input" placeholder="따뜻한 한 줄 위로를 남겨보세요" class="flex-1 bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-sm focus:bg-white focus:border-stone-400 outline-none transition-all text-stone-800 font-editorial-serif placeholder:text-stone-400">
                <button id="comment-submit-btn" class="bg-stone-900 hover:bg-stone-800 text-white rounded-2xl px-5 py-3 text-sm font-serif transition-colors whitespace-nowrap shadow-sm">
                    남기기
                </button>
            </div>

            <!-- Comments List -->
            <div id="comments-list" class="space-y-3">
                <!-- Comments inserted dynamically -->
            </div>
        </section>
    </main>

    <div id="toast" class="hidden"></div>

    <script>
        const token = sessionStorage.getItem('authToken');
        const currentUser = sessionStorage.getItem('authUsername');
        if (!token) window.location.href = '/login.html';

        const params = new URLSearchParams(window.location.search);
        const boardId = params.get('id');
        if (!boardId) window.location.href = '/board.html';

        const showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-stone-900 text-white px-6 py-3 rounded-full text-xs font-medium shadow-xl z-50';
            setTimeout(() => toast.className = 'hidden', 3000);
        };

        const loadPost = async () => {
            try {
                const res = await fetch(`/api/boards/${boardId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error('게시물을 불러오지 못했습니다.');
                const post = await res.json();
                
                document.getElementById('post-title').textContent = post.TITLE || '무제';
                document.getElementById('post-author').textContent = post.USERNAME || '익명';
                document.getElementById('post-date').textContent = new Date(post.CREATED_AT).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\.$/, '');
                
                const img = document.getElementById('post-image');
                if (post.IMAGE_BASE64) {
                    img.src = post.IMAGE_BASE64;
                    img.style.display = 'block';
                }

                // Weather & Mood pebble tags
                const tagsContainer = document.getElementById('post-tags');
                const tagList = [];
                if (post.WEATHER) tagList.push(`🌤️ ${post.WEATHER}`);
                if (post.MOOD) tagList.push(`${post.MOOD}`);
                if (post.MUSIC_MOOD) tagList.push(`🎵 ${post.MUSIC_MOOD}`);
                
                tagsContainer.innerHTML = tagList.map(tag => 
                    `<span class="rounded-full px-3 py-1 bg-stone-50 border border-stone-200 text-xs text-stone-600 font-serif">${tag}</span>`
                ).join('');

                // Format Poem with breathing divider (✦)
                const poemEl = document.getElementById('post-content');
                const rawPoem = (post.POEM_TEXT || post.CONTENT || post.THEME || '').trim();
                
                if (rawPoem.includes('\n\n')) {
                    const stanzas = rawPoem.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
                    poemEl.innerHTML = stanzas.map((stanza, idx) => {
                        const linesHtml = stanza.split('\n').join('<br>');
                        const dividerHtml = idx < stanzas.length - 1 ? '<div class="text-stone-300 tracking-widest text-xs my-4">✦</div>' : '';
                        return `<p>${linesHtml}</p>${dividerHtml}`;
                    }).join('');
                } else if (rawPoem.includes('\n')) {
                    const lines = rawPoem.split('\n').map(l => l.trim()).filter(Boolean);
                    if (lines.length >= 4) {
                        const half = Math.ceil(lines.length / 2);
                        const stanza1 = lines.slice(0, half).join('<br>');
                        const stanza2 = lines.slice(half).join('<br>');
                        poemEl.innerHTML = `<p>${stanza1}</p><div class="text-stone-300 tracking-widest text-xs my-4">✦</div><p>${stanza2}</p>`;
                    } else {
                        poemEl.innerHTML = `<p>${lines.join('<br>')}</p>`;
                    }
                } else {
                    poemEl.innerHTML = `<p>${rawPoem}</p>`;
                }

                if (post.USERNAME === currentUser || currentUser === 'admin') {
                    document.getElementById('action-btns').classList.remove('hidden');
                }

                const likeBtn = document.getElementById('like-btn');
                document.getElementById('like-count').textContent = post.LIKE_COUNT || 0;
                if (post.IS_LIKED > 0) {
                    likeBtn.classList.add('border-rose-200', 'text-rose-500', 'bg-rose-50/50');
                    document.getElementById('like-icon').textContent = '♥';
                }
            } catch (e) {
                showToast(e.message);
            }
        };

        const loadComments = async () => {
            try {
                const res = await fetch(`/api/comments/${boardId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const comments = await res.json();
                const list = document.getElementById('comments-list');
                const countEl = document.getElementById('comments-count');
                list.innerHTML = '';
                
                if (!comments || comments.length === 0) {
                    if (countEl) countEl.textContent = '0개';
                    list.innerHTML = '<p class="text-center text-stone-400 font-serif text-sm py-8">아직 남겨진 온기가 없습니다. 첫 번째 위로를 건네보세요.</p>';
                    return;
                }

                if (countEl) countEl.textContent = `${comments.length}개`;

                comments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'p-4 rounded-2xl bg-stone-50/70 border border-stone-200/80 flex flex-col gap-1.5 transition-colors hover:bg-stone-50';
                    const isMine = c.USERNAME === currentUser || currentUser === 'admin';
                    const delBtnHtml = isMine ? `<button onclick="deleteComment(${c.ID})" class="text-stone-400 hover:text-rose-500 text-xs transition-colors font-serif ml-2">삭제</button>` : '';
                    const dateStr = new Date(c.CREATED_AT).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    div.innerHTML = `
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-serif font-medium text-stone-800">${c.USERNAME}</span>
                            <div class="flex items-center text-stone-400 font-light">
                                <span>${dateStr}</span>
                                ${delBtnHtml}
                            </div>
                        </div>
                        <div class="text-stone-700 text-sm leading-relaxed whitespace-pre-wrap font-serif pt-0.5">${c.COMMENT_TEXT}</div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) { console.error(e); }
        };

        document.getElementById('like-btn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/likes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ board_id: boardId })
                });
                const data = await res.json();
                if (!res.ok) throw new Error('오류');
                
                document.getElementById('like-count').textContent = data.count;
                const btn = document.getElementById('like-btn');
                const icon = document.getElementById('like-icon');
                if (data.isLiked) {
                    btn.classList.add('border-rose-200', 'text-rose-500', 'bg-rose-50/50');
                    icon.textContent = '♥';
                } else {
                    btn.classList.remove('border-rose-200', 'text-rose-500', 'bg-rose-50/50');
                    icon.textContent = '♡';
                }
            } catch (e) { showToast('좋아요 처리 실패'); }
        });

        document.getElementById('comment-submit-btn').addEventListener('click', async () => {
            const txt = document.getElementById('comment-input').value.trim();
            if(!txt) return;
            try {
                const res = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ board_id: boardId, comment_text: txt })
                });
                if(res.ok) {
                    document.getElementById('comment-input').value = '';
                    loadComments();
                }
            } catch (e) { showToast('댓글 작성 실패'); }
        });

        // Enter key to submit comment
        document.getElementById('comment-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('comment-submit-btn').click();
            }
        });

        window.deleteComment = async (cid) => {
            if(!(await NeoModal.confirm('정말 댓글을 삭제하시겠습니까?'))) return;
            await fetch(`/api/comments/${cid}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadComments();
        };

        document.getElementById('delete-btn').addEventListener('click', async () => {
            if(!(await NeoModal.confirm('정말 게시글을 삭제하시겠습니까?'))) return;
            try {
                const res = await fetch(`/api/boards/${boardId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    window.location.href = '/board.html';
                } else {
                    showToast('삭제 권한이 없습니다.');
                }
            } catch (e) { showToast('에러'); }
        });

        document.getElementById('edit-btn').addEventListener('click', async () => {
            const newTitle = await NeoModal.prompt('수정할 제목을 입력하세요:', document.getElementById('post-title').textContent);
            if(newTitle === null) return;
            const newContent = await NeoModal.prompt('수정할 내용을 입력하세요:', document.getElementById('post-content').textContent);
            if(newContent === null) return;
            
            try {
                const res = await fetch(`/api/boards/${boardId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ title: newTitle, content: newContent })
                });
                if(res.ok) {
                    showToast('수정되었습니다.');
                    loadPost();
                }
            } catch (e) { showToast('수정 실패'); }
        });

        loadPost();
        loadComments();
    </script>
</body>
</html>
